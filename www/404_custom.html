<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! - 404</title>
    
    <style>
        body {
            text-align: center; 
            padding-top: 15vh; 
            /* Added modern coding fonts before falling back to Courier */
            font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
            /* Soft charcoal instead of pure black */
            background-color: #1e1d1b;
            /* Soft amber/wheat text instead of neon green */
            color: #e8c37d; 
            margin: 0;
            padding: 0 20px;
            /* Very subtle scanline */
            background-image: linear-gradient(rgba(232, 195, 125, 0.02) 50%, transparent 50%);
            background-size: 100% 4px;
        }
        
        .ascii-art {
            font-size: 2.5rem;
            margin: 0;
            line-height: 1.5;
            color: #f5a933;
        }
        
        h1 {
            font-size: 3rem;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #f5a933;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Much softer glow for readability */
            text-shadow: 0 0 10px rgba(245, 169, 51, 0.3);
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #d1b890;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: #f5a933;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2a2825;
            color: #f5a933;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #735b37;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .btn:hover {
            background-color: #f5a933;
            color: #1e1d1b;
            box-shadow: 0 0 12px rgba(245, 169, 51, 0.4);
        }
    </style>
</head>
<body>

    <div class="ascii-art">¯\_(ツ)_/¯</div>
    <h1>Error 404</h1>
    <p>Directory not found. The requested file has been purged.<span class="cursor"></span></p>
    
    <a href="/" class="btn">Return to Home</a>

</body>
</html>
